<!doctype html>
<html lang="en">
<!--
  =====================================================================
  PAGE: BRACKET PAGE. Draws the Supabase matches table as a tournament tree (read only).
       Winners are set on the admin page (/admin).

  Files for this page:
    HTML  bracket.html
    CSS   css/base.css (shared by all pages) + css/bracket.css (this page only)
    JS    js/bracket.js (this page only), plus the shared js files at the bottom
  =====================================================================
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bracket · Formula Makerspace</title>
  <!-- Fonts: change them in css/base.css (--font-...) if you swap these. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800&family=Barlow:ital,wght@0,600;1,700;1,800;1,900&family=Space+Mono:wght@400;700&display=swap">
  <!-- Shared look first, then this page's own styles. ADD: extra page styles go in css/bracket.css -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/bracket.css">
</head>
<body>
  <div class="page">

    <!-- HEADER: the same on every page. MENU stays top right.
         Keep the ids menuButton / menuPanel / menuClose: js/common.js uses them. -->

    <header class="site-header">
      <p class="site-title"><a href="index.html"><span>Formula</span><span>Makerspace</span></a></p>
      <button class="menu-button" id="menuButton" aria-expanded="false" aria-controls="menuPanel"><span class="checks"></span><span class="word">MENU</span></button>
    </header>
    <div class="checker" aria-hidden="true"></div>

    <!-- ===== PAGE CONTENT =====
         ADD: new sections for this page go between here and the END PAGE CONTENT comment.
         Elements with an id (like id="message") are filled in by the page's JS file. -->

    <h2 class="page-title">Bracket</h2>
    <p class="intro">Sixteen cars, head to head. Winners move up one row after every race.</p>
    <p class="message" id="message" role="status" hidden></p>
    <div class="bracket-scroll"><div class="bracket" id="bracket"></div></div>
    <p class="hint">Scroll sideways to see the whole bracket. It fills in after each race.</p>
    <!-- ===== END PAGE CONTENT ===== -->
  </div>

  <!-- MENU PANEL (opens from the MENU button).
       ADD A NEW PAGE: add a <li> line here, and the same line in the menu of every other page.
       aria-current="page" marks the page you are on. -->
  <div class="menu-panel" id="menuPanel" hidden>
    <nav aria-label="Menu">
      <div class="box-bar"><h2>Menu</h2><button class="button" id="menuClose" aria-label="Close menu">✕</button></div>
      <ul>
        <li><a href="index.html">Home<small>Next race</small></a></li>
        <li><a href="grid.html">The Grid<small>All vehicles</small></a></li>
        <li><a href="bracket.html" aria-current="page">Bracket<small>Tournament</small></a></li>
        <li><a href="vote.html">Vote<small>Crowd awards</small></a></li>
        <li><a href="betting.html">Betting<small>No money</small></a></li>
      </ul>
    </nav>
  </div>

  <!-- SCRIPTS: keep this order. Supabase library, then config (your keys), db (all reads/writes),
       common (shared helpers), and last this page's own file. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/common.js"></script>
  <script src="js/bracket.js"></script>
</body>
</html>
