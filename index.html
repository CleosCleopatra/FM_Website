<!doctype html>
<html lang="en">
<!--
  =====================================================================
  PAGE: HOME PAGE. Shows the current race with a countdown, the four tiles and the best lap.
       Data comes from Supabase via js/home.js (settings.current_match, matches, vehicles).

  Files for this page:
    HTML  index.html
    CSS   css/base.css (shared by all pages) + css/home.css (this page only)
    JS    js/home.js (this page only), plus the shared js files at the bottom
  =====================================================================
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Formula Makerspace</title>
  <!-- Fonts: change them in css/base.css (--font-...) if you swap these. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800&family=Barlow:ital,wght@0,600;1,700;1,800;1,900&family=Space+Mono:wght@400;700&display=swap">
  <!-- Shared look first, then this page's own styles. ADD: extra page styles go in css/home.css -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/home.css">
</head>
<body>
  <div class="page">

    <!-- HEADER: the same on every page. MENU stays top right.
         Keep the ids menuButton / menuPanel / menuClose: js/common.js uses them. -->

    <header class="site-header site-header--big">
      <h1 class="site-title"><span class="title-line-1">Formula</span><span class="title-line-2">Makerspace</span></h1>
      <button class="menu-button" id="menuButton" aria-expanded="false" aria-controls="menuPanel"><span class="checks"></span><span class="word">MENU</span></button>
    </header>
    <div class="checker" aria-hidden="true"></div>

    <!-- ===== PAGE CONTENT =====
         ADD: new sections for this page go between here and the END PAGE CONTENT comment.
         Elements with an id (like id="message") are filled in by the page's JS file. -->

    <p class="message" id="message" role="status" hidden></p>

    <!-- The current / next race. Filled in by js/home.js -->
    <section class="race-card" aria-labelledby="raceName">
      <div class="race-scene" id="raceScene" aria-hidden="true"></div>
      <div class="race-tab" id="raceTab">Next race <i></i></div>
      <div class="race-content" id="raceContent"></div>
    </section>

    <!-- TILES (buttons to the other pages).
         ADD A TILE: copy one <a class="tile"> line, change href, the icon in images/ and the text.
         Four tiles fill a 2 x 2 grid; with five or six, one row becomes a single tile or pair. -->
    <nav class="tiles" aria-label="Sections">
      <a class="tile" href="grid.html"><img src="images/icon-grid.svg" alt=""><span>Grid</span></a>
      <a class="tile" href="bracket.html"><img src="images/icon-bracket.svg" alt=""><span>Bracket</span></a>
      <a class="tile" href="vote.html"><img src="images/icon-vote.svg" alt=""><span>Vote</span></a>
      <a class="tile" href="betting.html"><img src="images/icon-betting.svg" alt=""><span>Betting</span></a>
    </nav>

    <!-- BEST LAP bar. Filled in by js/home.js from settings.best_lap_time and best_lap_vehicle_id. -->
    <div class="best-lap" id="bestLap"></div>
    <div class="checker checker--bottom" aria-hidden="true"></div>
    <!-- ===== END PAGE CONTENT ===== -->
  </div>

  <!-- MENU PANEL (opens from the MENU button).
       ADD A NEW PAGE: add a <li> line here, and the same line in the menu of every other page.
       aria-current="page" marks the page you are on. -->
  <div class="menu-panel" id="menuPanel" hidden>
    <nav aria-label="Menu">
      <div class="box-bar"><h2>Menu</h2><button class="button" id="menuClose" aria-label="Close menu">✕</button></div>
      <ul>
        <li><a href="index.html" aria-current="page">Home<small>Next race</small></a></li>
        <li><a href="grid.html">The Grid<small>All vehicles</small></a></li>
        <li><a href="bracket.html">Bracket<small>Tournament</small></a></li>
        <li><a href="vote.html">Vote<small>Crowd awards</small></a></li>
        <li><a href="betting.html">Betting<small>No money</small></a></li>
      </ul>
    </nav>
  </div>

  <!-- SCRIPTS: keep this order. Supabase library, then config (your keys), db (all reads/writes),
       common (shared helpers), and last this page's own file. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/common.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
